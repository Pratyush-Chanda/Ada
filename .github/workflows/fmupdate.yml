name: Update files.json

on:
  push:
    branches: ["**"]

jobs:
  fmtree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run fmtree tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript tests
        run: node --test tests/*.test.js

      - name: Verify theme browser bundle
        run: |
          npm run build:theme-compat
          git diff --exit-code -- bin/theme-compat.js

      - name: Run fmtree.py
        run: python fmtree.py

      - name: Commit files.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json bench.txt
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update files.json [skip ci]"
          git push
